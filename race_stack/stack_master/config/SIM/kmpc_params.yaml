# stack_master/config/SIM/kmpc_params.yaml
# Controller params: NUC2/kinematic_mpc_params.yaml with t_delay=0.0 for sim
# Car params: NUC2/car_model.yaml

controller:
  ros__parameters:
    N: 40
    steps_delay: 3
    t_delay: 0.0
    MPC_freq: 20
    overtake_d: 1.0
    track_safety_margin: 0.3
    track_max_width: 1000.0
    qac: 0.01
    qddelta: 0.1
    qadv: 0.0
    qn: 20.0
    qalpha: 7.0
    qv: 10.0
    zl: 10.0
    zu: 10.0
    Zl: 100.0
    Zu: 100.0
    delta_min: -0.40
    delta_max: 0.40
    v_min: 2.0
    v_max: 12.0
    ddelta_min: -0.2
    ddelta_max: 0.2
    a_min: -10.0
    a_max: 10.0
    alat_max: 10.0

car:
  ros__parameters:
    lr: 0.145
    lf: 0.162
    m: 3.54
    Iz: 0.05797
    h_cg: 0.014

trailing:
  ros__parameters:
    trailing_mode: true
    trailing_gap: 2.0
    trailing_p_gain: 1.0
    trailing_i_gain: 0.0
    trailing_d_gain: 0.2
    blind_trailing_speed: 1.5