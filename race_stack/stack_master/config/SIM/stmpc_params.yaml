# stack_master/config/SIM/stmpc_params.yaml
# Controller params: NUC2/single_track_mpc_params.yaml verbatim
# Car params: NUC2/car_model.yaml
# Tire params: placeholder — NUC2 Pacejka is floor-specific (hardware sysid required)

controller:
  ros__parameters:
    N: 40
    t_delay: 0.0025
    steps_delay: 3
    MPC_freq: 20
    track_safety_margin: 0.25
    track_max_width: 1000.0
    overtake_d: 1.0
    qjerk: 0.01
    qddelta: 0.5
    qadv: 0.0
    qn: 40.0
    qalpha: 0.1
    qv: 10.0
    Zl: 1000.0
    Zu: 1000.0
    zl: 1000.0
    zu: 1000.0
    delta_min: -0.4
    delta_max: 0.4
    v_min: 0.0
    v_max: 12.0
    a_min: -10.0
    a_max: 10.0
    ddelta_min: -3.2
    ddelta_max: 3.2
    jerk_min: -50.0
    jerk_max: 50.0
    alat_max: 10.0
    vy_minimization: true
    adv_maximization: false
    combined_constraints: "None"
    load_transfer: true
    correct_v_y_dot: true

car:
  ros__parameters:
    lr: 0.145
    lf: 0.162
    m: 3.54
    Iz: 0.05797
    h_cg: 0.014

tire:
  ros__parameters:
    friction_coeff: 1.0
    Bf: 5.5405
    Cf: 0.4182
    Df: 1.8635
    Ef: 0.3722
    Br: 6.6014
    Cr: 0.5624
    Dr: 1.7327
    Er: 1.0648

trailing:
  ros__parameters:
    trailing_mode: true
    trailing_gap: 2.0
    trailing_p_gain: 1.0
    trailing_i_gain: 0.0
    trailing_d_gain: 0.2
    blind_trailing_speed: 1.5