/**:
  # general parameters shared by all vesc-related nodes
  ros__parameters:
    # erpm (electrical rpm) = speed_to_erpm_gain * speed (meters / second) + speed_to_erpm_offset
    # Computed from VESC XML: pole_pairs=7, gear_ratio=3, wheel_diameter=0.083m
    # gain = 7 * 3 * 60 / (pi * 0.083) = 4832
    speed_to_erpm_gain: 4832.0
    # Offset = ERPM sensor zero-offset (not friction). Confirmed 0.0 via exp 1 (2026-05-19).
    # Note: smooth motion starts at ~2000 ERPM (~0.41 m/s). Don't command below 0.5 m/s.
    speed_to_erpm_offset: 0.0

    # servo value (0 to 1) = steering_angle_to_servo_gain * steering_angle (radians) + steering_angle_to_servo_offset
    # offset=0.542 confirmed via IMU drift test (2026-05-19). gain=-0.803 confirmed via physical measurement (25deg hard stop).
    steering_angle_to_servo_gain: -0.803
    steering_angle_to_servo_offset: 0.542

    port: /dev/sensors/vesc
    duty_cycle_min: 0.0
    duty_cycle_max: 0.95
    current_min: -60.0
    current_max: 60.0
    brake_min: -20000.0
    brake_max: 200000.0
    speed_min: -30000.0
    speed_max: 80000.0
    position_min: 0.0
    position_max: 0.0
    # confirmed via exp 4: left hard stop=0.150, right hard stop=0.848
    servo_min: 0.15
    servo_max: 0.85

vesc_to_odom_node:
  ros__parameters:
    odom_frame: odom
    base_frame: base_link
    publish_tf: false
    use_servo_cmd_to_calc_angular_velocity: true
    # From Traxxas Slash 4X4 VXL specs: 12.75in = 324mm
    wheelbase: 0.324

throttle_interpolator:
  ros__parameters:
    rpm_input_topic: commands/motor/unsmoothed_speed
    rpm_output_topic: commands/motor/speed
    servo_input_topic: commands/servo/unsmoothed_position
    servo_output_topic: commands/servo/position

    max_acceleration: 2.5
    throttle_smoother_rate: 75.0
    max_servo_speed: 3.2
    servo_smoother_rate: 75.0
