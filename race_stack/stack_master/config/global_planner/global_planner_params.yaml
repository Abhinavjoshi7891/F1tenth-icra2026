global_planner:
  ros__parameters:
    rate: 10  # [hz]
    required_laps: 1  # how many laps to drive until calculating global waypoints
    safety_width: 0.35
    safety_width_sp: 0.30
    occupancy_grid_threshold: 10
    filter_kernel_size: 3 # how much filtering to do to raw map images
    reverse_mapping: False

    show_plots: True
    centerline_smoother: 'savgol'
    optimizer_config: 'racecar_f110.ini'
