      ot_flag: true
    Overtaking_sector2:
      start: 251    # S=10.5-18m — WIDE zone, overtaking ENABLED (both walls > 0.65m)
      end: 429
      ot_flag: true
    Overtaking_sector3:
      start: 430    # S=18-23m — moderate width, overtaking DISABLED (post-apex hits S=3-4m tight zone)
      end: 547
      ot_flag: true
