# FrenetHyperparameters — ported from ROS1 frenet_planner_params_safe.yaml
frenet_planner:
  ros__parameters:
    # Solver hyperparameters
    max_speed: 10.0
    min_speed: 0.5
    max_accel: 8.0
    max_curvature: 2.0
    max_road_width_l: 1.5
    max_road_width_r: 1.5
    d_road_w: 0.05
    dt: 0.05
    maxt: 1.5
    mint: 1.0
    d_sample_t: 0.5
    d_t_s: 0.25
    d_t_s_ot: 2.0
    n_s_sample: 12.0
    track_clearance: 0.2
    obstacle_clearance: 0.35

    # Cost weights
    k_lat_dev: 0.6
    k_lat_v: 0.2
    k_lat_a: 0.0
    k_lat_j: 0.1
    k_lon_dev: 0.8
    k_track_bounds: 0.05
    k_obstacles: 1.0
    k_temporal: 1.0
    k_lat: 1.0
    k_lon: 1.0
    k_time: 1000.0

    # Threading (ignored in Python, kept for config compat / future C++ lift)
    num_threads: 0

    # Node params
    replanning_distance: 1.5
    ic_avoid_obstacles: false
    pub_only_if_obstacles: false
    pub_global_track_advancement: false
    debug: false
    measure: false
    max_frequency: 20.0
    frenet_speed_scaling: 0.85
